# =============================================================================
#  MediConnect — Nginx reverse proxy config
# =============================================================================
#
#  Behaviour:
#    - HTTP  → 301 redirect to HTTPS (except ACME challenges)
#    - HTTPS → reverse-proxy to the Next.js container
#    - /_next/static/* + /uploads/* → served directly by Nginx
#    - /api/* → stricter rate limiting
#
#  Before first boot you must either:
#    (a) Run certbot to obtain a certificate (see DEPLOYMENT.md §3), OR
#    (b) Comment out the server block listening on 443 so Nginx starts
#        without a cert, then switch back after provisioning.
# =============================================================================

# ---- Rate limiting zones --------------------------------------------
limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;

# ---- Upstream -------------------------------------------------------
upstream mediconnect_app {
  server app:3000;
  keepalive 32;
}

# ---- HTTP → HTTPS redirect -----------------------------------------
server {
  listen 80;
  listen [::]:80;
  server_name mediconnect.dz www.mediconnect.dz;

  # ACME challenge must still respond over HTTP
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ---- Main HTTPS server ---------------------------------------------
server {
  listen 443 ssl;
  http2 on;
  listen [::]:443 ssl;
  server_name mediconnect.dz www.mediconnect.dz;

  # ---- TLS (produced by certbot) ----
  ssl_certificate     /etc/letsencrypt/live/mediconnect.dz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mediconnect.dz/privkey.pem;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_dhparam /etc/nginx/dhparam.pem;

  # ---- Security headers ----
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options    nosniff always;
  add_header X-Frame-Options           SAMEORIGIN always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

  # Arabic uploads can get chunky; 10 MB covers CCP receipts + product images.
  client_max_body_size 10M;

  # ---- Gzip ----
  gzip               on;
  gzip_vary          on;
  gzip_min_length    1024;
  gzip_comp_level    6;
  gzip_types         text/plain text/css text/javascript application/javascript
                     application/json application/xml image/svg+xml;

  # ---- Static: Next.js assets ----
  location /_next/static/ {
    proxy_pass http://mediconnect_app;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    expires 365d;
    add_header Cache-Control "public, immutable, max-age=31536000";
    access_log off;
  }

  # ---- Static: user-uploaded CCP receipts ----
  # Served directly from disk — never hits the Node process.
  location /uploads/ {
    alias /var/www/uploads/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    # Restrict sensitive paths if needed:
    # auth_request /internal-auth-check;
  }

  # ---- Public images ----
  location /favicon.ico { proxy_pass http://mediconnect_app; expires 30d; access_log off; }
  location /icon.svg    { proxy_pass http://mediconnect_app; expires 30d; access_log off; }
  location /logo.svg    { proxy_pass http://mediconnect_app; expires 30d; access_log off; }

  # ---- Authentication endpoints — strictest rate limit ----
  location ~ ^/api/auth/(login|register)$ {
    limit_req zone=auth_zone burst=5 nodelay;
    proxy_pass http://mediconnect_app;
    include /etc/nginx/conf.d/proxy_common.conf;
  }

  # ---- All other API routes — standard rate limit ----
  location /api/ {
    limit_req zone=api_zone burst=20 nodelay;
    proxy_pass http://mediconnect_app;
    include /etc/nginx/conf.d/proxy_common.conf;
  }

  # ---- Everything else goes to Next.js ----
  location / {
    proxy_pass http://mediconnect_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
  }

  # ---- Deny common probes ----
  location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }
  location ~ \.(env|git|sql|bak)$ { deny all; access_log off; log_not_found off; }
}
