# =============================================================================
#  MediConnect — Nginx reverse proxy config (HTTP-only, pre-SSL)
# =============================================================================
#
#  After certbot obtains certs, replace this with the full SSL config.
# =============================================================================

# ---- Rate limiting zones --------------------------------------------
limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;

# ---- Upstream -------------------------------------------------------
upstream mediconnect_app {
  server app:3000;
  keepalive 32;
}

# ---- HTTP server ----------------------------------------------------
server {
  listen 80;
  listen [::]:80;
  server_name mediconnectdz.com www.mediconnectdz.com;

  # ACME challenge for future certbot
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Arabic uploads can get chunky; 10 MB covers CCP receipts + product images.
  client_max_body_size 10M;

  # ---- Gzip ----
  gzip               on;
  gzip_vary          on;
  gzip_min_length    1024;
  gzip_comp_level    6;
  gzip_types         text/plain text/css text/javascript application/javascript
                     application/json application/xml image/svg+xml;

  # ---- Static: Next.js assets ----
  location /_next/static/ {
    proxy_pass http://mediconnect_app;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    expires 365d;
    add_header Cache-Control "public, immutable, max-age=31536000";
    access_log off;
  }

  # ---- Static: user-uploaded CCP receipts ----
  location /uploads/ {
    alias /var/www/uploads/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  # ---- Public images ----
  location /favicon.ico { proxy_pass http://mediconnect_app; expires 30d; access_log off; }
  location /icon.svg    { proxy_pass http://mediconnect_app; expires 30d; access_log off; }
  location /logo.svg    { proxy_pass http://mediconnect_app; expires 30d; access_log off; }

  # ---- Authentication endpoints — strictest rate limit ----
  location ~ ^/api/auth/(login|register)$ {
    limit_req zone=auth_zone burst=5 nodelay;
    proxy_pass http://mediconnect_app;
    include /etc/nginx/conf.d/proxy_common.conf;
  }

  # ---- All other API routes — standard rate limit ----
  location /api/ {
    limit_req zone=api_zone burst=20 nodelay;
    proxy_pass http://mediconnect_app;
    include /etc/nginx/conf.d/proxy_common.conf;
  }

  # ---- Everything else goes to Next.js ----
  location / {
    proxy_pass http://mediconnect_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
  }

  # ---- Deny common probes ----
  location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }
  location ~ \.(env|git|sql|bak)$ { deny all; access_log off; log_not_found off; }
}
